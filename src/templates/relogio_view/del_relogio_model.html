<div
  class="modal fade text-left"
  id="relogio_del_modal"
  tabindex="-1"
  role="dialog"
  aria-labelledby="myModalLabel33"
  aria-hidden="true"
>
  <div
    class="modal-dialog modal-dialog-centered modal-dialog-scrollable"
    role="document"
  >
    <form action="{{ url_for('relogio_del') }}" method="post">
      <!-- ID -->
      <input type="hidden" id="del_id_id" name="id" />
      <!--  -->
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title" id="myModalLabel4">Exclusão de Relogio</h4>
          <button
            type="button"
            class="close"
            data-bs-dismiss="modal"
            aria-label="Close"
          >
            <i data-feather="x"></i>
          </button>
        </div>
        <div class="modal-body">
          <p>Tem certeza de que deseja excluir este relógio?</p>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-light-secondary me-1 mb-1"
            data-bs-dismiss="modal"
          >
            <span class="d-none d-sm-block">Close</span>
          </button>
          <button type="submit" class="btn btn-primary ml-1">
            <i class="bx bx-check d-block d-sm-none"></i>
            <span class="d-none d-sm-block">Yes</span>
          </button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var relogioEditModal = document.getElementById("relogio_del_modal");

    if (relogioEditModal) {
      relogioEditModal.addEventListener("show.bs.modal", function (event) {
        // Botão que acionou o modal
        var button = event.relatedTarget;

        // Extrai os dados dos atributos data-bs-*
        var id = button.getAttribute("data-bs-id");

        // Seleciona os inputs dentro do modal
        var inputId = relogioEditModal.querySelector("#del_id_id");

        // Atribui os valores aos inputs do modal
        inputId.value = id;
      });
    }
  });
</script>
